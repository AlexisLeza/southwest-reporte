<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<title>South Florida Roofing Ads</title>
<style>
/* Shell: the automatable.co look. Parchment, ink, terracotta, a serif for headings. */
:root {
  --cream: #f5f4ed;
  --cream-2: #efede4;
  --ink: #141413;
  --accent: #c96442;
  --accent-dark: #b05538;
  --accent-soft: #f6e6dc;
  --paper: #faf9f5;
  --muted: #5e5d59;
  --muted-soft: #87867f;
  --soft: #e8e6dc;
  --line: #e8e6dc;
  --ring: #d1cfc5;
  --serif: "Tiempos Text", Georgia, "Times New Roman", serif;
  --shadow: 0 1px 2px rgba(20, 20, 19, .04), 0 14px 36px rgba(20, 20, 19, .07);
  --shadow-sm: 0 1px 2px rgba(20, 20, 19, .05), 0 6px 16px rgba(20, 20, 19, .06);
  --radius: 16px;
  --top-h: 76px;
  --gutter: 48px;
  --panel-w: min(780px, 46vw);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* ---------- Top bar ---------- */
.top {
  position: sticky; top: 0; z-index: 30;
  height: var(--top-h);
  display: flex; align-items: center; gap: 28px;
  padding: 0 var(--gutter);
  background: rgba(245, 244, 237, .88);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 28px; height: 28px; flex: none; display: grid; place-items: center; }
.brand-name { font-family: var(--serif); font-weight: 500; font-size: 24px; letter-spacing: -0.01em; line-height: 1.1; white-space: nowrap; }
.brand-sub { font-size: 13px; color: var(--muted-soft); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 420px; }
.tabs { display: flex; gap: 6px; margin-left: auto; }
.tab {
  display: flex; align-items: center; gap: 10px;
  height: 42px; padding: 0 16px 0 7px;
  border: 1px solid transparent; border-radius: 10px;
  background: transparent; font-weight: 500; font-size: 15px; color: var(--ink);
  transition: background .15s, border-color .15s;
}
.tab:hover { background: var(--paper); border-color: var(--line); }
.tab-n {
  width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--soft); font-size: 13px; font-weight: 600; color: var(--muted);
}
.tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tab.on .tab-n { background: rgba(255, 255, 255, .22); color: #fff; }
.sample-pill {
  height: 30px; padding: 0 12px; display: flex; align-items: center;
  border: 1px dashed var(--ring); border-radius: 999px; color: var(--muted);
  font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em;
  white-space: nowrap;
}

/* ---------- Generic ---------- */
.view { padding: 0 var(--gutter); }
.view-ads { height: calc(100vh - var(--top-h)); display: flex; flex-direction: column; }
.hl { color: var(--accent); }
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.kicker { font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-soft); }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; padding: 34px 0 26px; }
.view-head h1 { margin: 0; font-family: var(--serif); font-size: 58px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.05; }
.view-head p { margin: 12px 0 0; font-size: 18px; color: var(--muted); font-weight: 400; }
.empty { padding: 120px 0; text-align: center; }
.empty h1 { font-family: var(--serif); font-size: 54px; font-weight: 500; letter-spacing: -0.015em; margin: 0 0 12px; }
.empty p { font-size: 19px; color: var(--muted); }
.empty code { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; }

/* ---------- Toolbar + chips ---------- */
.toolbar { display: flex; align-items: center; gap: 28px; padding: 24px 0 14px; }
.count { display: flex; align-items: baseline; gap: 20px; min-width: 0; }
.count h1 { margin: 0; font-family: var(--serif); font-size: 62px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
.count p { margin: 0; font-size: 18px; color: var(--muted); font-weight: 400; white-space: nowrap; }
.toolbar .seg { margin-left: auto; }
.filterbar { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 8px 10px 0; margin-right: calc(-1 * var(--gutter)); flex: none; }
.filterbar::-webkit-scrollbar { display: none; }
.filterbar .vsep { width: 1px; height: 26px; background: var(--ring); border-radius: 1px; margin: 0 10px; flex: none; }
.chip-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip-label { font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-soft); margin-right: 4px; flex: none; }
.chip {
  flex: none;
  height: 38px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--paper);
  font-size: 14px; font-weight: 500; white-space: nowrap;
  transition: border-color .15s, background .15s;
}
.chip:hover { border-color: var(--ring); }
.chip .n { font-weight: 400; color: var(--muted-soft); font-size: 13px; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip.on .n { color: #e3b9a6; }
.chip svg { width: 18px; height: 18px; flex: none; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper); padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; height: 32px; padding: 0 16px; font-weight: 500; font-size: 14px; border-radius: 7px; }
.seg button.on { background: var(--ink); color: var(--paper); }

/* ---------- Carousel ---------- */
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; margin: 0 calc(-1 * var(--gutter)); touch-action: pan-y; user-select: none; }
.track { position: absolute; top: 0; left: 0; height: 100%; display: flex; align-items: center; gap: 64px; padding: 0 64px; will-change: transform; transition: transform .5s cubic-bezier(.2, .8, .2, 1); }
.track.dragging { transition: none; }
.slide { flex: none; display: flex; flex-direction: column; align-items: center; transition: opacity .35s, transform .45s cubic-bezier(.2, .8, .2, 1), filter .35s; opacity: .35; transform: scale(.9); filter: saturate(.6); cursor: pointer; }
.slide.on { opacity: 1; transform: none; filter: none; }
.slide-meta { margin-top: 18px; display: flex; align-items: center; gap: 14px; opacity: 0; transition: opacity .3s; font-size: 15px; font-weight: 500; white-space: nowrap; }
.slide.on .slide-meta { opacity: 1; }
.slide-meta .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ring); }
.slide-meta .muted { color: var(--muted); font-weight: 400; }
.btn {
  height: 42px; padding: 0 18px; display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--accent); border-radius: 10px; background: var(--accent); color: #fff;
  font-weight: 500; font-size: 15px;
  transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn svg path, .btn svg line, .btn svg polyline { stroke: currentColor; }
.btn.ghost { background: var(--paper); color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ring); background: var(--paper); }
.arrow {
  position: absolute; top: 50%; z-index: 5; transform: translateY(-50%);
  width: 60px; height: 60px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--paper); box-shadow: var(--shadow-sm);
  display: grid; place-items: center; transition: border-color .15s, box-shadow .15s;
}
.arrow:hover { border-color: var(--ring); box-shadow: var(--shadow); }
.arrow:disabled { opacity: .25; pointer-events: none; }
.arrow.prev { left: 32px; } .arrow.next { right: 32px; }
body.panel-open .arrow.next { right: calc(var(--panel-w) + 32px); }
body.panel-open .controls { padding-right: var(--panel-w); }
body.panel-open .controls .hint { display: none; }
.controls { transition: padding .45s; display: flex; align-items: center; justify-content: center; gap: 18px; height: 58px; flex: none; font-weight: 500; }
.controls .pos { font-size: 16px; font-variant-numeric: tabular-nums; min-width: 90px; text-align: center; }
.controls .hint { font-size: 14px; color: var(--muted-soft); font-weight: 400; }
.dots { display: flex; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ring); transition: all .25s; }
.dots i.on { width: 24px; border-radius: 6px; background: var(--accent); }

/* ---------- Fit wrapper + badges ---------- */
.fit { position: relative; flex: none; }
.fit > .ad { position: absolute; top: 0; left: 0; transform-origin: top left; }
.tier {
  position: absolute; top: -26px; left: -26px; z-index: 3;
  width: 50px; height: 50px; border-radius: 50%;
  border: 1px solid var(--line); box-shadow: var(--shadow-sm);
  display: grid; place-items: center;
  font-family: var(--serif); font-weight: 500; font-size: 24px; line-height: 1;
  background: var(--paper); color: var(--ink);
}
.tier.A { background: var(--accent-soft); border-color: #ecc9b8; color: var(--accent-dark); }
.tier.C { background: var(--soft); color: var(--muted); }
.tier.S { background: var(--accent); border-color: var(--accent); color: #fff; }
.tier.sm { width: 38px; height: 38px; font-size: 18px; top: -19px; left: -19px; }
.tier-inline { position: static; width: 36px; height: 36px; font-size: 17px; box-shadow: none; }

/* ---------- Wall ---------- */
.wall { flex: 1; overflow-y: auto; margin: 0 calc(-1 * var(--gutter)); padding: 18px var(--gutter) 60px calc(var(--gutter) + 14px); }
.wall-cols { columns: 5 290px; column-gap: 34px; }
.wall-item { break-inside: avoid; margin: 0 0 34px; display: flex; flex-direction: column; align-items: center; cursor: pointer; padding-top: 22px; }
.wall-item .fit { transition: transform .2s; }
.wall-item:hover .fit { transform: translateY(-3px); }
.wall-cap { margin-top: 10px; font-size: 13px; font-weight: 400; color: var(--muted); text-align: center; }

.toolbar .city-seg + .seg { margin-left: 12px; }

/* Landing panel, winners, you, ours vs theirs, published. */

/* ---------- Landing panel ---------- */
.panel {
  position: fixed; top: var(--top-h); right: 0; bottom: 0; z-index: 40;
  width: var(--panel-w);
  background: var(--cream);
  border-left: 1px solid var(--line);
  box-shadow: -18px 0 40px rgba(20, 20, 19, .06);
  transform: translateX(calc(100% + 40px));
  transition: transform .45s cubic-bezier(.2, .8, .2, 1);
  overflow-y: auto; overscroll-behavior: contain;
}
body.panel-open .panel { transform: none; }
.scrim { display: none; }
.panel-inner { padding: 26px 32px 48px; }
.panel-top { display: flex; align-items: center; gap: 12px; }
.panel-top .kicker { color: var(--ink); }
.close {
  margin-left: auto; width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center;
  box-shadow: var(--shadow-sm);
}
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--paper);
  font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
}
.pill.y { background: var(--accent-soft); border-color: #ecc9b8; color: var(--accent-dark); }
.pill.k { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.panel-url { margin: 12px 0 18px; font-size: 14px; color: var(--muted); font-weight: 400; word-break: break-all; }
.browser { overflow: hidden; padding: 0; }
.browser-bar { height: 40px; display: flex; align-items: center; gap: 7px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--cream-2); }
.browser-bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--ring); }
.browser-bar span { margin-left: 10px; flex: 1; height: 24px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); font-size: 12px; font-weight: 400; display: flex; align-items: center; padding: 0 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); }
.shot { max-height: 44vh; overflow-y: auto; background: #f2f2f2; }
.shot img { display: block; width: 100%; }
.shot .none { height: 150px; display: grid; place-items: center; color: var(--muted); font-weight: 400; }
.page-h1 { margin: 26px 0 6px; font-family: var(--serif); font-size: 30px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.15; }
.page-title { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fact { padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.fact.wide { grid-column: 1 / -1; }
.fact .kicker { font-size: 11px; margin-bottom: 6px; }
.fact .v { font-size: 18px; font-weight: 500; line-height: 1.3; }
.fact .v.big { font-family: var(--serif); font-size: 32px; }
.fact .v.none { color: var(--muted-soft); font-weight: 400; font-size: 15px; }
.proofs { display: flex; flex-wrap: wrap; gap: 8px; }
.proofs span { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; font-weight: 400; background: var(--cream); }
.panel h3 { margin: 30px 0 12px; font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-soft); }
.ad-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ad-facts div { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.ad-facts b { display: block; font-family: var(--serif); font-weight: 500; font-size: 20px; }
.ad-facts small { font-size: 12px; color: var(--muted-soft); font-weight: 400; }
.why { margin-top: 12px; padding: 14px 16px; border-radius: 12px; background: var(--accent-soft); border: 1px solid #ecc9b8; color: var(--accent-dark); font-weight: 500; font-size: 15px; }

/* ---------- Winners ---------- */
.win-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 30px; padding-bottom: 70px; }
.win { display: grid; grid-template-columns: 70px 288px 1fr; gap: 22px; align-items: center; padding: 22px 24px 22px 18px; cursor: pointer; transition: box-shadow .2s, border-color .2s; }
.win:hover { border-color: var(--ring); box-shadow: 0 2px 4px rgba(20, 20, 19, .05), 0 20px 44px rgba(20, 20, 19, .09); }
.win-rank { text-align: center; }
.win-rank b { display: block; font-family: var(--serif); font-size: 44px; font-weight: 500; line-height: 1; }
.win-rank small { display: block; margin-top: 6px; font-size: 12px; font-weight: 400; color: var(--muted-soft); line-height: 1.25; }
.win-thumb { height: 272px; display: grid; place-items: center; background: var(--cream-2); border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
.win-thumb .fit > .ad { box-shadow: none; }
.win-body { min-width: 0; }
.win-top { display: flex; align-items: center; gap: 12px; }
.win-adv { font-family: var(--serif); font-size: 21px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win-hl { margin: 6px 0 12px; font-size: 14px; color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.score b { font-family: var(--serif); font-size: 38px; font-weight: 500; line-height: 1; min-width: 56px; }
.score small { font-size: 13px; color: var(--muted-soft); font-weight: 400; }
.bar { flex: 1; height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.clues { display: flex; flex-wrap: wrap; gap: 8px; }
.clue { padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--cream); line-height: 1.15; }
.clue b { display: block; font-size: 16px; font-weight: 600; }
.clue small { font-size: 11px; font-weight: 500; color: var(--muted-soft); text-transform: uppercase; letter-spacing: .08em; }
.clue.grade { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.clue.grade small { color: #e3b9a6; }
.win-why { margin-top: 12px; font-size: 14px; font-weight: 400; color: var(--muted); }
.legend { display: flex; gap: 10px; align-items: center; }
.legend .tier { position: static; box-shadow: none; width: 38px; height: 38px; font-size: 18px; }
.legend span { font-weight: 500; font-size: 16px; color: var(--muted); margin-right: 10px; }

/* ---------- You ---------- */
.you-sum { padding: 30px 34px; font-size: 20px; line-height: 1.6; font-weight: 400; color: var(--muted); max-width: 1100px; margin-bottom: 34px; }
.you-sum p { margin: 0 0 10px; }
.you-sum p.tag { font-family: var(--serif); font-size: 34px; font-weight: 500; color: var(--ink); line-height: 1.2; margin-bottom: 14px; }
.proof-head { margin: 8px 0 18px; font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-soft); }
.proof .claim.solo { font-size: 23px; }
.you-sum p:last-child { margin: 0; }
.proof-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 40px; }
.proof { padding: 24px 28px; display: flex; flex-direction: column; gap: 8px; min-height: 150px; }
.proof .big { font-family: var(--serif); font-size: 56px; font-weight: 500; line-height: 1; }
.proof .claim { font-family: var(--serif); font-size: 21px; font-weight: 500; line-height: 1.3; }
.proof .src { margin-top: auto; font-size: 13px; color: var(--muted-soft); font-weight: 400; }
.proof.first { background: var(--accent-soft); border-color: #ecc9b8; }

/* ---------- Ours vs theirs ---------- */
.vs-list { display: flex; flex-direction: column; gap: 30px; padding-bottom: 40px; }
.vs { display: grid; grid-template-columns: minmax(0, 1.08fr) 76px minmax(0, 1fr); gap: 22px; align-items: center; padding: 30px 32px; }
.vs-side .kicker { margin-bottom: 14px; display: flex; align-items: center; gap: 10px; color: var(--ink); }
.vs-ours .fit { margin: 34px 0 0 30px; }
.vs-mid { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-family: var(--serif); font-weight: 500; font-size: 22px; box-shadow: var(--shadow-sm); justify-self: center; }
.gates { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.gate { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); font-weight: 500; font-size: 15px; }
.gate .ok { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.gate .ok svg path { stroke: #fff; }
.gate .vote { display: flex; gap: 5px; }
.gate .vote i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ring); }
.gate .vote i.w { background: var(--accent); border-color: var(--accent); }
.gate small { font-weight: 400; color: var(--muted-soft); font-size: 13px; }
.angle { font-weight: 500; color: var(--muted-soft); font-size: 14px; }
.theirs-row { display: flex; gap: 18px; align-items: flex-start; }
.their { flex: 1; min-width: 0; }
.their-box { height: 250px; display: grid; place-items: center; background: var(--cream-2); border: 1px solid var(--line); border-radius: 12px; position: relative; }
.their-cap { margin-top: 8px; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.their-cap small { display: block; color: var(--muted-soft); font-weight: 400; }
.sent-back { padding: 26px 30px; margin-bottom: 70px; }
.sent-back h2 { margin: 0 0 16px; font-family: var(--serif); font-size: 26px; font-weight: 500; }
.sb-row { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.sb-row b { font-size: 17px; font-weight: 500; }
.sb-row .angle { display: block; font-size: 13px; margin-top: 3px; }
.sb-why { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- Published ---------- */
.pub { padding: 34px 38px; margin-bottom: 40px; }
.pub-top { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.pub-top .kicker { color: var(--ink); font-size: 13px; }
.paused { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px; border: 1px solid #ecc9b8; border-radius: 999px; background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; font-size: 16px; letter-spacing: .1em; margin-left: auto; }
.paused svg rect { fill: var(--accent-dark); }
.pub-name { font-family: var(--serif); font-size: 48px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.1; margin: 0 0 26px; }
.ids { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

/* Ours vs theirs: funnel, side-by-side rows, buyer verdicts. */

/* ---------- Funnel ---------- */
.funnel { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 40px; padding: 30px 34px; margin-bottom: 34px; }
.fn-rows { display: flex; flex-direction: column; gap: 14px; }
.fn-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; grid-template-areas: "n track cut" "n label label"; column-gap: 18px; row-gap: 6px; align-items: center; }
.fn-n { grid-area: n; font-family: var(--serif); font-size: 52px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
.fn-track { grid-area: track; height: 16px; background: var(--cream-2); border-radius: 999px; overflow: hidden; }
.fn-track i { display: block; height: 100%; border-radius: 999px; background: var(--ring); }
.fn-row.last .fn-track i { background: var(--accent); }
.fn-row.last .fn-n { color: var(--accent); }
.fn-label { grid-area: label; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.fn-label b { font-size: 16px; font-weight: 600; }
.fn-label small { font-size: 14px; color: var(--muted-soft); font-weight: 400; }
.fn-cut { grid-area: cut; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-dark); white-space: nowrap; }
.fn-kept { border-left: 1px solid var(--line); padding-left: 34px; align-self: stretch; }
.fn-kept .kicker { margin-bottom: 14px; color: var(--ink); }
.fn-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.fn-chips span { padding: 8px 13px; border-radius: 10px; background: var(--accent-soft); border: 1px solid #ecc9b8; color: var(--accent-dark); font-size: 14px; font-weight: 500; }

/* ---------- Side by side ---------- */
.vs2 { padding: 28px 32px 0; overflow: hidden; }
.vs2-grid { display: grid; grid-template-columns: minmax(0, 1fr) 76px minmax(0, 1fr); gap: 22px; align-items: start; }
.vs2-grid .vs-mid { align-self: center; }

/* Real-looking ads, one renderer per platform. Each returns an HTML string. */

function mediaPlaceholder(ad, dark, video) {
  const h = hue(ad.advertiser || ad.domain);
  const bg = dark
    ? `linear-gradient(150deg, hsl(${h},35%,22%), hsl(${(h + 40) % 360},30%,10%))`
    : `linear-gradient(150deg, hsl(${h},60%,90%), hsl(${(h + 40) % 360},55%,80%))`;
  const text = joinText(ad.headline, " | ") || ad.advertiser || "";
  const size = text.length > 80 ? 22 : text.length > 40 ? 28 : 34;
  return `<div class="media-ph${video ? " vid" : ""}" style="background:${bg};color:${dark ? "#fff" : "#1c1c1c"};font-size:${size}px">${esc(text)}<small>${esc(ad.domain || ad.display_url || "")}</small></div>`;
}

function displayUrl(ad) {
  const clean = v => String(v || "").replace(/^https?:\/\//, "").replace(/\/$/, "");
  const metaHost = v => BLOCKED_HOSTS.some(b => clean(v).split("/")[0].replace(/^www\./, "").endsWith(b));
  const raw = [ad.display_url, ad.domain, hostOf(ad.landing_url)].find(v => v && !metaHost(v));
  return clean(raw);
}

function googleUrlLine(ad) {
  const d = displayUrl(ad);
  if (!d) return "";
  const parts = d.split("/").filter(Boolean);
  const host = parts.shift();
  const full = /^www\./.test(host) ? host : `www.${host}`;
  return `https://${esc(full)}${parts.map(p => ` <span>&rsaquo;</span> ${esc(p)}`).join("")}`;
}

function googleHead(ad) {
  const name = ad.advertiser || ad.domain || "Sponsored";
  const host = (ad.domain || hostOf(ad.landing_url) || displayUrl(ad).split("/")[0] || "").replace(/^www\./, "");
  const fav = host && !ad.own ? img(`https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`, "", "") : "";
  return `<div class="g-sponsored">Sponsored</div>
    <div class="g-head">
      <div class="g-fav">${esc(initials(name)[0])}${fav}</div>
      <div class="g-site"><div class="g-name">${esc(name)}</div><div class="g-url">${googleUrlLine(ad)}</div></div>
      <div class="g-dots">${ICON.dotsV}</div>
    </div>`;
}

function googleSearch(ad, headlines) {
  const descs = asList(ad.description).concat(asList(ad.body));
  const links = asList(Array.isArray(ad.sitelinks) ? ad.sitelinks.map(s => (s && typeof s === "object") ? (s.text || s.title) : s) : ad.sitelinks);
  const callouts = asList(ad.callouts);
  return `<div class="ad g-ad${ad.mobile ? " g-mobile" : ""}">
    ${googleHead(ad)}
    <div class="g-title">${esc(headlines.slice(0, 3).join(" | "))}</div>
    <div class="g-desc clamp2">${esc(descs.slice(0, 2).join(" "))}</div>
    ${links.length ? `<div class="g-links">${links.slice(0, 4).map(esc).join('<span class="sep">&middot;</span>')}</div>` : ""}
    ${callouts.length ? `<div class="g-callouts">${callouts.slice(0, 4).map(esc).join('<span class="sep">&middot;</span>')}</div>` : ""}
  </div>`;
}

function googleVideo(ad) {
  const m = ad.media || {};
  const src = m.thumbnail || m.image;
  const name = ad.advertiser || ad.domain || "Sponsored";
  return `<div class="ad g-ad g-video">
    <div class="g-vid">${src ? "" : mediaPlaceholder({ ...ad, headline: ad.headline || "Video ad" }, true, true)}${img(src, "", "")}<div class="play" style="background:#ff0033;border:0;border-radius:18px;width:68px;height:48px">${ICON.play}</div><span class="g-vid-ad">Sponsored</span></div>
    <div class="g-vid-meta">${avatar(name, ad.avatar)}<div><div class="g-vid-title">${esc(joinText(ad.headline, " | ") || "Video ad on YouTube")}</div><div class="g-vid-sub">Sponsored &middot; ${esc(name)}</div></div></div>
  </div>`;
}

/* No text captured: the Transparency Center image IS the ad, so show it on its own. */
function googleDisplay(ad) {
  const m = ad.media || {};
  const src = m.image || m.thumbnail;
  if (src && ad.format === "text") {
    return `<div class="ad g-ad g-shot"><div class="g-creative">${img(src, "", "Google ad")}</div></div>`;
  }
  return `<div class="ad g-ad g-display">
    ${googleHead(ad)}
    <div class="g-creative">${src ? img(src, "", "Ad creative") : mediaPlaceholder(ad)}</div>
  </div>`;
}

function renderGoogle(ad) {
  const headlines = asList(ad.headline);
  if (headlines.length) return googleSearch(ad, headlines);
  if (ad.format === "video") return googleVideo(ad);
  return googleDisplay(ad);
}

function metaMedia(ad) {
  const m = ad.media || {};
  const isVideo = ad.format === "video" || (m.video && !m.image);
  const src = isVideo ? (m.thumbnail || m.image) : (m.image || m.thumbnail);
  return `<div class="fb-media">${mediaPlaceholder(ad, false, isVideo)}${img(src, "", "")}${isVideo ? `<div class="play">${ICON.play}</div>` : ""}</div>`;
}

function metaCarousel(ad) {
  const cards = (Array.isArray(ad.cards) ? ad.cards : []).filter(c => c && typeof c === "object").slice(0, 5);
  return `<div class="fb-carousel">${cards.map(c => `
    <div class="fb-card">
      <div class="img">${mediaPlaceholder({ ...ad, headline: c.title })}${img(c.image, "", "")}</div>
      <div class="fb-card-b"><div class="t clamp2">${esc(c.title || ad.headline || "")}</div>${(c.cta || ad.cta) ? `<div class="fb-cta">${esc(c.cta || ad.cta)}</div>` : ""}</div>
    </div>`).join("")}</div>`;
}

function renderFacebook(ad) {
  const name = ad.advertiser || "Sponsored";
  const text = ad.body || "";
  const isCarousel = ad.format === "carousel" && Array.isArray(ad.cards) && ad.cards.length > 1;
  const hl = joinText(ad.headline, " | ");
  const linkBar = (hl || ad.cta || displayUrl(ad)) ? `
    <div class="fb-link">
      <div class="fb-link-l">
        <div class="fb-domain">${esc(displayUrl(ad))}</div>
        ${hl ? `<div class="fb-hl clamp2">${esc(hl)}</div>` : ""}
        ${ad.description ? `<div class="fb-ld">${esc(joinText(ad.description, " "))}</div>` : ""}
      </div>
      ${ad.cta ? `<div class="fb-cta">${esc(ad.cta)}</div>` : ""}
    </div>` : "";
  return `<div class="ad fb">
    <div class="fb-head">
      ${avatar(name, ad.avatar)}
      <div class="fb-who"><div class="fb-name">${esc(name)}</div><div class="fb-sub">Sponsored &middot; ${ICON.globe}</div></div>
      <div class="fb-icons">${ICON.dotsH}${ICON.x}</div>
    </div>
    ${text ? `<div class="fb-text"><div class="clamp3">${esc(text)}</div><button class="more" data-more="See more" hidden>See more</button></div>` : `<div style="height:12px"></div>`}
    ${isCarousel ? metaCarousel(ad) : metaMedia(ad) + linkBar}
    <div class="fb-actions"><span>${ICON.like}Like</span><span>${ICON.comment}Comment</span><span>${ICON.share}Share</span></div>
  </div>`;
}

function renderInstagram(ad) {
  const name = ad.advertiser || "sponsored";
  const handle = String(name).toLowerCase().replace(/[^a-z0-9._]/g, "");
  return `<div class="ad ig">
    <div class="ig-head">
      <div class="ig-ring">${avatar(name, ad.avatar)}</div>
      <div style="flex:1;min-width:0"><div class="ig-name">${esc(handle)}</div><div class="ig-sub">Sponsored</div></div>
      <div style="color:#000">${ICON.dotsH}</div>
    </div>
    ${metaMedia(ad).replace("fb-media", "fb-media ig-media")}
    <div class="ig-cta"><span>${esc(ad.cta || "Learn more")}</span>${ICON.chevR}</div>
    <div class="ig-actions">${ICON.igHeart}${ICON.igComment}${ICON.igSend}</div>
    <div class="ig-text"><div class="clamp3"><b>${esc(handle)}</b>${esc(ad.body || joinText(ad.headline, " "))}</div><button class="more" data-more="more" hidden>more</button></div>
  </div>`;
}

function renderMeta(ad) {
  const p = asList(ad.placements).map(s => s.toLowerCase());
  if (p.length && p.includes("instagram") && !p.includes("facebook")) return renderInstagram(ad);
  return renderFacebook(ad);
}

function renderTikTok(ad) {
  const m = ad.media || {};
  const name = ad.advertiser || "sponsored";
  const handle = String(name).replace(/\s+/g, "").replace(/[^A-Za-z0-9._]/g, "");
  const caption = ad.body || joinText(ad.headline, " ");
  const src = m.thumbnail || m.image;
  const likes = fmtNum(ad.likes);
  return `<div class="ad tt">
    <div class="tt-media">${src ? "" : `<div class="tt-ph" style="background:linear-gradient(160deg,hsl(${hue(name)},45%,28%),#050505)">${esc(String(ad.headline || caption).slice(0, 90))}</div>`}${img(src, "", "")}</div>
    <div class="tt-shade"></div>
    <div class="tt-top"><span>Following</span><span class="on">For You</span></div>
    <div class="tt-search">${ICON.search}</div>
    <div class="play" style="background:rgba(0,0,0,.25);border:0">${ICON.play}</div>
    <div class="tt-rail">
      <div class="tt-av">${avatar(name, ad.avatar)}<div class="tt-plus">${ICON.plus}</div></div>
      <div>${ICON.heart}<span>${esc(likes || "")}</span></div>
      <div>${ICON.bubble}<span></span></div>
      <div>${ICON.bookmark}<span></span></div>
      <div>${ICON.ttshare}<span>Share</span></div>
      <div class="tt-disc"></div>
    </div>
    <div class="tt-bottom">
      <div class="tt-handle">${esc(handle || name)}</div>
      <div class="tt-caption clamp3">${esc(caption)}</div>
      <div class="tt-sponsored">Sponsored</div>
      <div class="tt-music">${ICON.note}<span>${esc(ad.music || "Promoted Music")}</span></div>
      <div class="tt-cta"><span>${esc(ad.cta || "Learn more")}</span>${ICON.chevR}</div>
    </div>
  </div>`;
}

function renderLinkedIn(ad) {
  const m = ad.media || {};
  const name = ad.advertiser || "Sponsored";
  const isVideo = ad.format === "video";
  const src = isVideo ? (m.thumbnail || m.image) : (m.image || m.thumbnail);
  const hl = joinText(ad.headline, " | ");
  return `<div class="ad li">
    <div class="li-head">
      ${avatar(name, ad.avatar, "li-logo")}
      <div class="li-who"><div class="li-name">${esc(name)}</div><div class="li-sub">Promoted</div></div>
      <div class="li-dots">${ICON.dotsH}</div>
    </div>
    <div class="li-text"><div class="clamp3">${esc(ad.body || "")}</div></div>
    <div class="li-media ${isVideo ? "" : "square"}">${src ? "" : mediaPlaceholder(ad, true, isVideo)}${img(src, "", "")}${isVideo ? `<div class="play">${ICON.play}</div>` : ""}</div>
    <div class="li-bar">
      <div class="li-bar-l">${hl ? `<div class="li-hl clamp2">${esc(hl)}</div>` : ""}<div class="li-domain">${esc(displayUrl(ad))}</div></div>
      <div class="li-cta">${esc(ad.cta || "Learn more")}</div>
    </div>
    <div class="li-actions"><span>${ICON.like}Like</span><span>${ICON.comment}Comment</span><span>${ICON.repost}Repost</span><span>${ICON.send}Send</span></div>
  </div>`;
}

function renderAd(ad) {
  switch ((ad.platform || "").toLowerCase()) {
    case "google": return renderGoogle(ad);
    case "meta": case "facebook": case "instagram": return renderMeta(ad);
    case "tiktok": return renderTikTok(ad);
    case "linkedin": return renderLinkedIn(ad);
    default: return renderGoogle(ad);
  }
}

/* Our draft, drawn on its own platform with our name and domain. */
function renderDraft(d, biz) {
  const ad = {
    platform: d.platform || "google",
    advertiser: biz.name || "You",
    domain: biz.domain || null,
    display_url: biz.domain || null,
    headline: asList(d.headline).map(shownText),
    description: d.platform === "google" ? d.description : (d.link_description || null),
    body: d.platform === "google" ? null : joinText(d.description, " "),
    cta: d.cta || null,
    format: "image",
    media: d.media || {},
    sitelinks: d.sitelinks || null,
    callouts: d.callouts || null,
    own: true,
    mobile: (d.platform || "google") === "google",
  };
  if (d.display_path) ad.display_url = `${biz.domain || ""}/${asList(d.display_path).join("/")}`;
  return renderAd(ad);
}

/* A fit box: the ad keeps its natural size and is scaled to fit. */
function fitBox(adHtml, badge) {
  return `<div class="fit">${badge || ""}${adHtml}</div>`;
}

function tierBadge(t, small) {
  if (!t || !/^[ABCS]$/.test(String(t))) return "";
  return `<div class="tier ${esc(t)}${small ? " sm" : ""}">${esc(t)}</div>`;
}

/* "See more" shows only when the text is cut off. Clicking it opens the full text.
   All reads happen before any write, so the browser lays the page out once, not once per ad. */
function markMore(root) {
  const btns = [...root.querySelectorAll("[data-more]")];
  const show = btns.map(b => {
    const text = b.previousElementSibling;
    return !!(text && (text.classList.contains("open") || text.scrollHeight > text.clientHeight + 1));
  });
  btns.forEach((b, i) => { b.hidden = !show[i]; });
}

function toggleMore(btn) {
  const open = btn.previousElementSibling.classList.toggle("open");
  btn.textContent = open ? "See less" : btn.dataset.more;
  if (CURRENT_FIT) CURRENT_FIT();
}

/* Measure every ad first, then size every box: one layout pass instead of one per ad.
   offsetWidth ignores transforms, so the current scale never needs resetting. */
function fitAll(root, maxW, maxH, maxScale) {
  markMore(root);
  const boxes = [...root.querySelectorAll(".fit")]
    .map(f => ({ f, ad: f.querySelector(".ad") }))
    .filter(b => b.ad)
    .map(b => ({ ...b, w: b.ad.offsetWidth, h: b.ad.offsetHeight }));
  boxes.forEach(({ f, ad, w, h }) => {
    if (!w || !h) return;
    const s = Math.min(maxScale || 1, maxW / w, maxH / h);
    ad.style.transform = `scale(${s})`;
    f.style.width = `${Math.round(w * s)}px`;
    f.style.height = `${Math.round(h * s)}px`;
  });
}

/* Ads view: count, filters, the swipeable carousel and the wall. */

function countTitle(list) {
  const n = list.length;
  const what = state.platform === "all" ? (n === 1 ? "ad" : "ads") : (n === 1 ? PLATFORMS[state.platform].plural.replace(/ads$/, "ad") : PLATFORMS[state.platform].plural);
  return `<span class="hl">${n}</span> ${esc(what)}`;
}

function countSub(list) {
  if (state.comp !== "all") return `from ${esc(COMP_NAME[state.comp] || state.comp)}`;
  const comps = new Set(list.map(compKey)).size;
  const plats = new Set(list.map(platformOf)).size;
  return `from ${comps} competitor${comps === 1 ? "" : "s"}${state.city ? ` in ${esc(state.city)}` : ""}${state.platform === "all" ? ` across ${plats} platform${plats === 1 ? "" : "s"}` : ""}`;
}

function platformChips() {
  const byComp = ADS.filter(a => inCity(a) && (state.comp === "all" || compKey(a) === state.comp));
  const counts = {};
  byComp.forEach(a => { const p = platformOf(a); counts[p] = (counts[p] || 0) + 1; });
  const chips = [`<button class="chip ${state.platform === "all" ? "on" : ""}" data-plat="all">All <span class="n">${byComp.length}</span></button>`];
  PLATFORM_ORDER.filter(p => counts[p]).forEach(p => {
    chips.push(`<button class="chip ${state.platform === p ? "on" : ""}" data-plat="${p}">${ICON[p]}${esc(PLATFORMS[p].label)} <span class="n">${counts[p]}</span></button>`);
  });
  return chips.join("");
}

function compChips() {
  const byPlat = ADS.filter(a => inCity(a) && (state.platform === "all" || platformOf(a) === state.platform));
  const counts = {};
  byPlat.forEach(a => { const k = compKey(a); counts[k] = (counts[k] || 0) + 1; });
  const shown = COMPETITORS.filter(c => counts[c.key]).slice(0, 12);
  return [`<button class="chip ${state.comp === "all" ? "on" : ""}" data-comp="all">All</button>`]
    .concat(shown.map(c => `<button class="chip ${state.comp === c.key ? "on" : ""}" data-comp="${esc(c.key)}">${esc(c.name)} <span class="n">${counts[c.key]}</span></button>`))
    .join("");
}

function slideMeta(ad) {
  const bits = [`<b>${esc(ad.advertiser || COMP_NAME[compKey(ad)] || "")}</b>`];
  if (ad.days_running !== null && ad.days_running !== undefined) bits.push(`<span class="muted">Running ${fmtInt(ad.days_running)} day${ad.days_running === 1 ? "" : "s"}</span>`);
  else if (ad.start_date) bits.push(`<span class="muted">Since ${esc(fmtDate(ad.start_date))}</span>`);
  if (ad.score !== null && ad.score !== undefined) bits.push(`<span class="muted">Score ${esc(ad.score)}</span>`);
  return bits.join('<i class="dot"></i>') + `<button class="btn" data-open="${esc(ad.id)}">Landing page ${ICON.arrowR}</button>`;
}

function renderAdsView() {
  if (state.list !== "all" && rankings()) { renderRankedView(); return; }
  const list = filteredAds();
  if (state.idx >= list.length) state.idx = Math.max(0, list.length - 1);
  const body = !list.length
    ? `<div class="empty"><h1>Nothing here.</h1><p>No ads match these filters.</p></div>`
    : state.mode === "wall" ? wallHtml(list) : stageHtml(list);
  document.getElementById("app").innerHTML = `
    <section class="view view-ads">
      <div class="toolbar">
        <div class="count"><h1>${countTitle(list)}</h1><p>${countSub(list)}</p></div>
        ${listToggle()}
        ${cityToggle()}
        <div class="seg"><button class="${state.mode === "carousel" ? "on" : ""}" data-mode="carousel">Swipe</button><button class="${state.mode === "wall" ? "on" : ""}" data-mode="wall">Wall</button></div>
      </div>
      <div class="filterbar">
        <span class="chip-label">Platform</span>${platformChips()}
        <span class="vsep"></span>
        <span class="chip-label">Competitor</span>${compChips()}
      </div>
      ${body}
    </section>`;
  CURRENT_FIT = () => carLayout(false);
  bindAdsView();
  if (list.length) carLayout(false);
}

/* Top Rated and Best Offers: ranked lists, Google and Facebook in their own sections. */
function renderRankedView() {
  document.getElementById("app").innerHTML = `
    <section class="view view-ads">
      <div class="toolbar">
        <div class="count">${rankCount(state.list)}</div>
        ${listToggle()}
        ${cityToggle()}
      </div>
      ${rankRule(state.list)}
      ${rankListHtml(state.list)}
    </section>`;
  CURRENT_FIT = fitRankList;
  bindAdsView();
  fitRankList();
}

function stageHtml(list) {
  return `<div class="stage" id="stage">
      <button class="arrow prev" id="prev" aria-label="Previous ad">${ICON.left}</button>
      <div class="track" id="track">${list.map((ad, i) => `
        <div class="slide" data-i="${i}" data-id="${esc(ad.id)}">
          ${fitBox(renderAd(ad), tierBadge(ad.tier))}
          <div class="slide-meta">${slideMeta(ad)}</div>
        </div>`).join("")}</div>
      <button class="arrow next" id="next" aria-label="Next ad">${ICON.right}</button>
    </div>
    <div class="controls"><span class="pos" id="pos"></span><span class="hint">Arrow keys or swipe. Click an ad to see the page behind it.</span></div>`;
}

function wallItem(ad) {
  return `<div class="wall-item" data-open="${esc(ad.id)}">
      ${fitBox(renderAd(ad), tierBadge(ad.tier, true))}
      <div class="wall-cap">${esc(ad.advertiser || "")}${ad.days_running ? ` &middot; ${fmtInt(ad.days_running)} days` : ""}</div>
    </div>`;
}

/* With every platform showing, Google and Facebook each get their own section. */
function wallHtml(list) {
  const plats = PLATFORM_ORDER.filter(p => list.some(a => platformOf(a) === p));
  if (state.platform !== "all" || plats.length < 2) return `<div class="wall" id="wall"><div class="wall-cols">${list.map(wallItem).join("")}</div></div>`;
  return `<div class="wall" id="wall">${plats.map(p => {
    const ads = list.filter(a => platformOf(a) === p);
    return `<section class="rank-sec"><div class="rank-head">${ICON[p] || ""}<h2>${esc(PLATFORMS[p].label)}</h2><span>${fmtInt(ads.length)} ad${ads.length === 1 ? "" : "s"}</span></div>
      <div class="wall-cols">${ads.map(wallItem).join("")}</div></section>`;
  }).join("")}</div>`;
}

function bindAdsView() {
  const app = document.getElementById("app");
  app.querySelectorAll("[data-plat]").forEach(b => b.onclick = () => { state.platform = b.dataset.plat; state.idx = 0; closePanel(); renderAdsView(); });
  app.querySelectorAll("[data-comp]").forEach(b => b.onclick = () => { state.comp = b.dataset.comp; state.idx = 0; closePanel(); renderAdsView(); });
  app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { state.mode = b.dataset.mode; closePanel(); renderAdsView(); });
  app.querySelectorAll("[data-list]").forEach(b => b.onclick = () => { state.list = b.dataset.list; state.idx = 0; closePanel(); renderAdsView(); });
  const stage = document.getElementById("stage");
  if (stage) bindStage(stage);
}

function carLayout(animate) {
  const stage = document.getElementById("stage");
  const wall = document.getElementById("wall");
  if (wall) { fitAll(wall, 290, 2000, 1); return; }
  if (document.getElementById("ranklist")) { fitRankList(); return; }
  if (!stage) return;
  const track = document.getElementById("track");
  const maxH = Math.max(240, stage.clientHeight - 140);
  const maxW = Math.min(980, (stage.clientWidth - panelWidth()) * 0.62);
  fitAll(track, maxW, maxH, 1.45);
  carPosition(animate);
}

function panelWidth() {
  return document.body.classList.contains("panel-open") ? document.getElementById("panel").offsetWidth : 0;
}

function carPosition(animate) {
  const track = document.getElementById("track");
  const stage = document.getElementById("stage");
  if (!track || !stage) return;
  const slides = track.children;
  const s = slides[state.idx];
  if (!s) return;
  if (animate === false) track.classList.add("dragging");
  const x = (stage.clientWidth - panelWidth()) / 2 - (s.offsetLeft + s.offsetWidth / 2);
  track.dataset.x = x;
  track.style.transform = `translateX(${x}px)`;
  [...slides].forEach((el, i) => el.classList.toggle("on", i === state.idx));
  if (animate === false) { void track.offsetWidth; track.classList.remove("dragging"); }
  const n = slides.length;
  document.getElementById("pos").textContent = `${state.idx + 1} / ${n}`;
  document.getElementById("prev").disabled = state.idx === 0;
  document.getElementById("next").disabled = state.idx >= n - 1;
}

function carGo(i) {
  const n = filteredAds().length;
  if (!n) return;
  state.idx = Math.max(0, Math.min(n - 1, i));
  carPosition(true);
  if (state.panelId) openPanel(filteredAds()[state.idx].id, true);
}

function bindStage(stage) {
  const track = document.getElementById("track");
  document.getElementById("prev").onclick = e => { e.stopPropagation(); carGo(state.idx - 1); };
  document.getElementById("next").onclick = e => { e.stopPropagation(); carGo(state.idx + 1); };
  stage.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest(".arrow")) return;
    CAR_DRAG = { x0: e.clientX, base: Number(track.dataset.x || 0), moved: false, target: e.target };
    track.classList.add("dragging");
  });
  let wheelAcc = 0, wheelLock = 0;
  stage.addEventListener("wheel", e => {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    if (Date.now() < wheelLock) return;
    wheelAcc += e.deltaX;
    if (Math.abs(wheelAcc) > 50) { carGo(state.idx + (wheelAcc > 0 ? 1 : -1)); wheelAcc = 0; wheelLock = Date.now() + 380; }
  }, { passive: false });
}

/* Drag listeners live on window once, so re-rendering never stacks them. */
let CAR_DRAG = null;
window.addEventListener("pointermove", e => {
  const track = document.getElementById("track");
  if (!CAR_DRAG || !track) return;
  const dx = e.clientX - CAR_DRAG.x0;
  if (Math.abs(dx) > 6) CAR_DRAG.moved = true;
  if (CAR_DRAG.moved) track.style.transform = `translateX(${CAR_DRAG.base + dx}px)`;
});
window.addEventListener("pointerup", e => {
  const track = document.getElementById("track");
  if (!CAR_DRAG || !track) { CAR_DRAG = null; return; }
  const d = CAR_DRAG; CAR_DRAG = null;
  track.classList.remove("dragging");
  const dx = e.clientX - d.x0;
  if (d.moved) {
    if (dx < -60) carGo(state.idx + Math.max(1, Math.round(-dx / 500)));
    else if (dx > 60) carGo(state.idx - Math.max(1, Math.round(dx / 500)));
    else carPosition(true);
    return;
  }
  const slide = d.target.closest(".slide");
  if (!slide) return;
  const i = Number(slide.dataset.i);
  const wasActive = i === state.idx;
  if (!wasActive) carGo(i);
  else if (d.target.closest("[data-more]")) return;
  if (wasActive || d.target.closest("[data-open]") || state.panelId) openPanel(slide.dataset.id);
});

/* Ads view, "Top Rated" and "Best Offers": ranked lists from data/rankings.json, one section per city and platform. */

/* DATA is declared in app.js, which loads after this file, so read it lazily. */
function rankings() { return DATA.rankings || null; }
let TOP_BY_ID = null, OFFER_BY_ID = null;
function rankIndex() {
  if (TOP_BY_ID) return;
  const r = rankings() || {};
  TOP_BY_ID = Object.fromEntries((r.top_rated || []).map(t => [t.id, t]));
  OFFER_BY_ID = {};
  (r.offers || []).forEach(o => (o.ids || [o.id]).forEach(id => { OFFER_BY_ID[id] = OFFER_BY_ID[id] || o; }));
}

const LIST_MODES = [["all", "All"], ["top", "Top Rated"], ["offers", "Best Offers"]];
/* What each city's list is ranked by. rankings.json can name it per city and platform in "clues",
   e.g. { "Dublin:google": "impressions a day" }. Otherwise the platform default is used. */
const CLUE_DEFAULT = { google: "days running", meta: "Meta's impressions order" };
function clueName(city, plat) { return ((rankings() || {}).clues || {})[`${city}:${plat}`] || CLUE_DEFAULT[plat] || "delivery"; }
const OFFER_TYPE = { price: "Price", "money off": "Money off", free: "Free", guarantee: "Guarantee", speed: "Speed" };

function listToggle() {
  if (!rankings()) return "";
  return `<div class="seg list-seg">${LIST_MODES.map(([k, l]) => `<button class="${state.list === k ? "on" : ""}" data-list="${k}">${esc(l)}</button>`).join("")}</div>`;
}

function listRows(kind) {
  const r = rankings() || {};
  return (kind === "top" ? r.top_rated : r.offers || []).filter(x => AD_BY_ID[x.id] && (!state.city || x.city === state.city));
}

function sectionHead(city, plat, n, kind) {
  const c = (rankings().counts[city] || {})[plat] || {};
  const label = PLATFORMS[plat] ? PLATFORMS[plat].label : plat;
  const sub = kind === "top"
    ? `Ranked by ${esc(clueName(city, plat))}. Best ${fmtInt(c.top)} of ${fmtInt(c.unique)} kept ads.`
    : `${n} real offer${n === 1 ? "" : "s"} in ${fmtInt(c.unique)} kept ads, best first.`;
  return `<div class="rank-head">${ICON[plat] || ""}<h2>${state.city ? "" : `${esc(city)} · `}${esc(label)}</h2><span>${sub}</span></div>`;
}

function topCard(t) {
  const ad = AD_BY_ID[t.id];
  const copies = (t.copies || []).length;
  return `<div class="card win rank-card" data-open="${esc(ad.id)}">
    <div class="win-rank"><b>#${esc(t.rank)}</b><small>of ${fmtInt(t.of)}</small></div>
    <div class="win-thumb">${fitBox(renderAd(ad))}</div>
    <div class="win-body">
      <div class="win-adv">${esc(ad.advertiser || "")}</div>
      <div class="rank-clue"><b>${esc(t.clue.value)}</b><span>${esc(t.clue.label)}</span></div>
      <div class="win-why">${esc(t.clue.detail || "")}</div>
      <div class="clues">
        ${t.clue.label === "days running" ? "" : clue("days running", hasNum(ad.days_running) ? fmtInt(ad.days_running) : null)}
        ${clue("copies counted once", copies ? fmtInt(copies + 1) : null)}
        ${clue("status", ad.active ? "Running now" : ad.last_seen ? `Last seen ${fmtDate(ad.last_seen)}` : null)}
      </div>
    </div>
  </div>`;
}

function offerCard(o) {
  const ad = AD_BY_ID[o.id];
  const more = (o.ids || []).length - 1;
  return `<div class="card win rank-card" data-open="${esc(ad.id)}">
    <div class="win-rank"><b>#${esc(o.rank)}</b><small>offer</small></div>
    <div class="win-thumb">${fitBox(renderAd(ad))}</div>
    <div class="win-body">
      <div class="win-top">${o.type ? `<span class="pill y">${esc(OFFER_TYPE[o.type] || o.type)}</span>` : ""}<div class="win-adv">${esc(ad.advertiser || "")}</div></div>
      <div class="offer-text">${esc(o.offer)}</div>
      ${o.verdict ? `<div class="win-why">${esc(o.verdict)}</div>` : ""}
      <div class="clues">
        ${clue("days running", hasNum(ad.days_running) ? fmtInt(ad.days_running) : null)}
        ${clue("more ads with it", more > 0 ? fmtInt(more) : null)}
      </div>
    </div>
  </div>`;
}

function rankListHtml(kind) {
  const rows = listRows(kind);
  const cities = state.city ? [state.city] : CITIES;
  const parts = [];
  cities.forEach(city => ["google", "meta"].forEach(plat => {
    const sec = rows.filter(x => x.city === city && x.platform === plat).sort((a, b) => a.rank - b.rank);
    const body = sec.length ? `<div class="win-grid rank-grid">${sec.map(kind === "top" ? topCard : offerCard).join("")}</div>`
      : `<p class="rank-none">${kind === "top" ? "No kept ads on this platform." : "No real offers in these ads. Phone numbers, free quotes and \"call now\" do not count."}</p>`;
    parts.push(`<section class="rank-sec">${sectionHead(city, plat, sec.length, kind)}${body}</section>`);
  }));
  return `<div class="wall rank-wall" id="ranklist">${parts.join("")}</div>`;
}

function rankCount(kind) {
  const n = listRows(kind).length;
  const where = state.city ? ` in ${esc(state.city)}` : "";
  if (kind === "top") return `<h1><span class="hl">${n}</span> top rated</h1><p>best 15% per platform${where}</p>`;
  return `<h1><span class="hl">${n}</span> real offer${n === 1 ? "" : "s"}</h1><p>ranked like a harsh buyer${where}</p>`;
}

function fitRankList() {
  const el = document.getElementById("ranklist");
  if (el) fitAll(el, 272, 256, 1);
}

function rankRule(kind) {
  const r = rankings();
  if (!r) return "";
  const what = kind === "top"
    ? "Each ad is scored on its best clue. Copies of the same ad count once."
    : "Prices, money off, free things, guarantees and speed promises. A phone number, a free quote or \"call now\" is not an offer.";
  return `<p class="rank-rule">${what} Only ads that ran ${fmtInt(r.rules.min_days)}+ days, have a landing page and are not Google Maps or Local Services ads. Built ${esc(fmtDate(r.built) || "")}.</p>`;
}

/* Side panel: the landing page behind an ad, and what that page offers. */

function factBox(label, value, opts) {
  const o = opts || {};
  const has = value !== null && value !== undefined && String(value).trim() !== "";
  return `<div class="fact ${o.wide ? "wide" : ""}"><div class="kicker">${esc(label)}</div><div class="v ${has ? (o.big ? "big" : "") : "none"}">${has ? esc(value) : esc(o.empty || "Not found on the page")}</div></div>`;
}

/* A real offer gives the buyer something: a price, money off, something free, a guarantee.
   "Book an assessment" is a call to action, so it gets no Offer box. */
const OFFER_RE = /(\$|€|£|\d+\s?%|\bfree\b|\boff\b|discount|\bsave\b|guarantee|warranty|no call[- ]?out|fixed price|flat rate|financing|rebate|coupon)/i;

function realOffer(page) {
  if (page && page.offer && OFFER_RE.test(page.offer)) return page.offer;
  if (page && page.price) return page.price;
  return null;
}

function impressionsText(ad) {
  const r = ad.impressions_range;
  if (Array.isArray(r) && r.length === 2 && (r[0] || r[1])) return `${fmtNum(r[0])} to ${fmtNum(r[1])}`;
  if (platformOf(ad) === "meta") return null;  /* Meta reach and order get their own boxes */
  if (ad.eu_reach) return `${fmtNum(ad.eu_reach)} people reached`;
  if (ad.impressions_rank) return `#${ad.impressions_rank} in Meta's order`;
  return null;
}

function panelHtml(ad) {
  const page = pageFor(ad);
  const url = (page && page.url) || ad.landing_url;
  const href = safeHref(url);
  const shot = page && safeSrc(page.screenshot);
  const proof = page ? asList(page.proof) : [];
  const offer = realOffer(page);
  const type = page ? (page.is_homepage ? "Homepage" : "Matched page") : null;
  const others = page ? asList(page.ad_ids).filter(id => id !== ad.id).length : 0;
  const scored = ad.score !== null && ad.score !== undefined;
  const plat = PLATFORMS[platformOf(ad)];
  const days = ad.days_running !== null && ad.days_running !== undefined ? `${fmtInt(ad.days_running)} days` : null;
  rankIndex();
  const top = TOP_BY_ID[ad.id], adOffer = OFFER_BY_ID[ad.id];
  return `<div class="panel-inner">
    <div class="panel-top">
      <span class="kicker">The ad</span>
      <button class="close" data-close aria-label="Close">${ICON.close}</button>
    </div>
    <div class="panel-ad">${fitBox(renderAd(ad))}</div>
    <div class="panel-top panel-sub">
      <span class="kicker">Landing page</span>
      ${type ? `<span class="pill ${page.is_homepage ? "" : "y"}">${type}</span>` : ""}
      ${others ? `<span class="pill">${others + 1} ads point here</span>` : ""}
    </div>
    <div class="panel-url">${href ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" style="color:inherit">${esc(url)}</a>` : esc(url || "No landing page captured for this ad")}</div>
    <div class="card browser">
      <div class="browser-bar"><i></i><i></i><i></i><span>${esc(url ? url.replace(/^https?:\/\//, "") : "")}</span></div>
      <div class="shot">${shot ? `<img src="${esc(shot)}" alt="Landing page screenshot" onerror="this.parentNode.innerHTML='<div class=&quot;none&quot;>Screenshot missing</div>'">` : `<div class="none">${page ? "No screenshot" : "Page not captured yet"}</div>`}</div>
    </div>
    <div class="facts">
      <div class="fact wide"><div class="kicker">Social proof</div>${proof.length ? `<div class="proofs">${proof.slice(0, 8).map(p => `<span>${esc(p)}</span>`).join("")}</div>` : `<div class="v none">No social proof on the page</div>`}</div>
      ${adOffer ? factBox(`Offer in the ad, #${adOffer.rank} in ${adOffer.city}`, adOffer.offer, { wide: true }) : ""}
      ${top ? factBox("Top rated", `#${top.rank} of ${fmtInt(top.of)} on ${plat ? plat.label : top.platform} in ${top.city}: ${top.clue.value} ${top.clue.label}`, { wide: true }) : ""}
      ${offer ? factBox("The offer on the page", offer, { wide: true }) : ""}
      ${factBox("Platform", plat ? plat.label : ad.platform)}
      ${factBox("Location", cityOf(ad) || null, { empty: "Not known" })}
      ${factBox("How long", days, { big: true, empty: "Not shown" })}
      ${factBox(ad.impressions_scope ? `Impressions, ${ad.impressions_scope}` : "Impressions", impressionsText(ad), { empty: "Not public" })}
      ${platformOf(ad) === "meta" ? factBox("EU reach", ad.eu_reach ? `${fmtInt(ad.eu_reach)} people` : null, { empty: "Not shown in the EU" }) : ""}
      ${platformOf(ad) === "meta" ? factBox("Meta impressions order", ad.impressions_rank ? `#${ad.impressions_rank} of this page's ads` : null, { empty: "Not given" }) : ""}
      ${scored ? `<div class="fact wide"><div class="kicker">Score</div><div class="v big">${esc(ad.score)} / 100</div>${ad.why ? `<div class="v none">${esc(ad.why)}</div>` : ""}</div>` : ""}
    </div>
  </div>`;
}

function openPanel(id, keepScroll) {
  const ad = AD_BY_ID[id];
  if (!ad) return;
  const panel = document.getElementById("panel");
  const wasOpen = document.body.classList.contains("panel-open");
  state.panelId = id;
  panel.innerHTML = panelHtml(ad);
  const adBox = panel.querySelector(".panel-ad");
  if (adBox) fitAll(adBox, adBox.clientWidth, 1400, 1);
  if (!keepScroll) panel.scrollTop = 0;
  panel.setAttribute("aria-hidden", "false");
  document.body.classList.add("panel-open");
  if (!wasOpen && state.view === "ads") setTimeout(() => carLayout(true), 0);
}

function closePanel() {
  if (!document.body.classList.contains("panel-open")) return;
  state.panelId = null;
  document.body.classList.remove("panel-open");
  document.getElementById("panel").setAttribute("aria-hidden", "true");
  if (state.view === "ads") carLayout(true);
}

/* Stage views: winners (rank), your business (learn), published. Ours vs theirs lives in versus.js. */

function hasNum(v) { return v !== null && v !== undefined && v !== "" && !isNaN(Number(v)); }

function clue(label, value) {
  return value === null || value === undefined || value === "" ? "" : `<div class="clue"><b>${esc(value)}</b><small>${esc(label)}</small></div>`;
}

function winnerCard(ad) {
  const p = platformOf(ad);
  const score = hasNum(ad.score) ? Math.round(Number(ad.score)) : null;
  const grade = ad.grade && GRADE_TEXT[ad.grade] ? `<div class="clue grade"><b>${esc(ad.grade)}</b><small>confidence, ${esc(GRADE_TEXT[ad.grade])}</small></div>` : "";
  return `<div class="card win" data-open="${esc(ad.id)}">
    <div class="win-rank"><b>#${esc(ad.rank || "?")}</b><small>on ${esc(PLATFORMS[p] ? PLATFORMS[p].label : p)}</small></div>
    <div class="win-thumb">${fitBox(renderAd(ad))}</div>
    <div class="win-body">
      <div class="win-top">${tierBadge(ad.tier).replace('class="tier', 'class="tier tier-inline')}<div class="win-adv">${esc(ad.advertiser || "")}</div></div>
      <div class="win-hl">${esc(joinText(ad.headline, " | ") || ad.body || "")}</div>
      <div class="score"><b>${score === null ? "n/a" : score}</b><div class="bar"><i style="width:${score === null ? 0 : Math.max(2, Math.min(100, score))}%"></i></div><small>/ 100</small></div>

function proofCard(item, first) {
  const claim = stripMd(item.claim);
  const lead = claim.match(/^([$€£]?\d[\d.,]*[KkMm]?\+?%?|#\d+)\s+(.*)$/);
  const any = !lead && claim.match(/([$€£]\d[\d.,]*[KkMm]?\+?|\b(?:19|20)\d{2}\b|\b\d{1,3}(?:,\d{3})+\+?|\b\d+[KkMm]\+?)/);
  const tidy = t => t.replace(/[.,]+$/, "");
  const body = lead ? `<div class="big">${esc(tidy(lead[1]))}</div><div class="claim">${esc(lead[2])}</div>`
    : any ? `<div class="big">${esc(tidy(any[1]))}</div><div class="claim">${esc(claim)}</div>`
    : `<div class="claim solo">${esc(claim)}</div>`;
  return `<div class="card proof ${first ? "first" : ""}">${body}${item.source ? `<div class="src">${esc(stripMd(item.source))}</div>` : ""}</div>`;
}

/* Ours vs theirs: the headline funnel, then each ad that shipped next to the competitor ad it beat. */

function voteDots(bt) {
  const runs = Math.max(1, Math.min(10, Number(bt && bt.runs) || 10));
  const wins = Math.max(0, Math.min(runs, Number(bt && bt.wins) || 0));
  return `<span class="vote">${Array.from({ length: runs }, (_, i) => `<i class="${i < wins ? "w" : ""}"></i>`).join("")}</span>`;
}

function funnelCard(f) {
  const counts = f.counts || {};
  const stages = asList((f.filters || []).map(s => s && s.key)).map(k => (f.filters || []).find(s => s.key === k));
  const top = Math.max(1, Number(counts[stages[0] && stages[0].key]) || 1);
  const rows = stages.map((s, i) => {
    const n = Number(counts[s.key]) || 0;
    const prev = i ? Number(counts[stages[i - 1].key]) || 0 : null;
    const cut = prev === null ? "" : `<span class="fn-cut">${prev - n > 0 ? `${fmtInt(prev - n)} cut` : "none cut"}</span>`;
    return `<div class="fn-row ${i === stages.length - 1 ? "last" : ""}">
      <div class="fn-n">${fmtInt(n)}</div>
      <div class="fn-track"><i style="width:${Math.max(1.5, (n / top) * 100)}%"></i></div>
      <div class="fn-label"><b>${esc(s.label)}</b><small>${esc(s.detail || "")}</small></div>
      ${cut}
    </div>`;
  }).join("");
  const chips = asList((f.survivors || []).map(s => s && s.text));
  return `<div class="card funnel">
    <div class="fn-rows">${rows}</div>
    ${chips.length ? `<div class="fn-kept"><div class="kicker">The ${chips.length} that made it</div><div class="fn-chips">${chips.map(c => `<span>${esc(c)}</span>`).join("")}</div></div>` : ""}
  </div>`;
}

function rivalLabel(ad, note) {
  if (!ad) return "";
  const p = PLATFORMS[platformOf(ad)] ? PLATFORMS[platformOf(ad)].label : "";
  return `<div class="vs-cap"><b>${esc(ad.advertiser || "")}</b><small>${esc([p, note].filter(Boolean).join("  ·  "))}</small></div>`;
}

    ${d.verdict ? `<blockquote>"${esc(d.verdict)}"<cite>${esc(d.verdict_by || "Harsh buyer")}</cite></blockquote>` : ""}

}

      ${advStat("run both", both, rows.length)}
    </div>
    <div class="card adv-wrap"><table class="adv-table">
      <thead><tr><th>Maps</th><th>Business</th><th>Reviews</th><th>${ICON.google}Google</th><th>${ICON.meta}Facebook &amp; Instagram</th></tr></thead>
      <tbody>${rows.map(advRow).join("")}</tbody>
    </table></div>
    <p class="adv-note">Google ads are looked up by website domain. Meta ads are looked up by the Facebook page linked from the business's site, or found by web search. "Could not be read" means the scraper could not open that page, so the answer is unknown, not no.</p>
  </section>`;
}

function jumpToAds(el) {
  state.city = el.dataset.jumpCity || state.city;
  state.comp = el.dataset.jump;
  state.platform = "all";
  state.idx = 0;
  setView("ads");
}

document.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const row = e.target.closest("[data-jump]");
  if (row) jumpToAds(row);
});
document.addEventListener("keydown", e => {
  const row = e.target.closest && e.target.closest("[data-jump]");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); jumpToAds(row); }
});

/* App state, header tabs, routing and keyboard. Loaded last. */
const DATA = (() => {
  try { return JSON.parse(document.getElementById("payload").textContent); }
  catch (e) { console.error("Dashboard data could not be read", e); return { ads: [] }; }
})();
const ADS = Array.isArray(DATA.ads) ? DATA.ads : [];
const PAGES = Array.isArray(DATA.pages) ? DATA.pages : [];
const AD_BY_ID = Object.fromEntries(ADS.map(a => [a.id, a]));

const VIEWS = [
  { id: "plumbers", n: 0, label: "Who advertises", on: () => !!(DATA.advertisers && DATA.advertisers.length) },
  { id: "ads", n: 1, label: "Ads", on: () => ADS.length > 0 },
  { id: "winners", n: 2, label: "Winners", on: () => !!DATA.ranked },
  { id: "you", n: 3, label: "Your business", on: () => !!(DATA.proof && DATA.proof.length) },
  { id: "versus", n: 4, label: "Ours vs theirs", on: () => !!(DATA.drafts && DATA.drafts.length) },
  { id: "published", n: 5, label: "Published", on: () => !!DATA.published },
];

const state = { view: "ads", list: "all", platform: "all", comp: "all", mode: "wall", idx: 0, winPlatform: "all", panelId: null };

/* City switch: ads are only ever compared with ads from the same city. */
function cityOf(ad) {
  const c = ad.city || ad.location || ad.market;
  return c ? String(c).replace(/\b\w/g, m => m.toUpperCase()) : "";
}
const CITIES = (() => {
  const n = {};
  ADS.forEach(a => { const c = cityOf(a); if (c) n[c] = (n[c] || 0) + 1; });
  return Object.keys(n).sort((a, b) => n[b] - n[a]);
})();
state.city = CITIES[0] || null;
function inCity(a) { return !state.city || cityOf(a) === state.city; }
function cityToggle() {
  if (CITIES.length < 2) return "";
  const all = `<button class="${state.city ? "" : "on"}" data-city="all">All</button>`;
  return `<div class="seg city-seg">${all}${CITIES.map(c => `<button class="${state.city === c ? "on" : ""}" data-city="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-city]");
  if (!b) return;
  state.city = b.dataset.city === "all" ? null : b.dataset.city; state.idx = 0; state.comp = "all";
  closePanel(); render();
});

function compKey(ad) { return String(ad.domain || ad.advertiser || "unknown").toLowerCase().replace(/^www\./, ""); }

const COMPETITORS = (() => {
  const named = {};
  (DATA.competitors || []).forEach(c => { if (c && c.domain) named[String(c.domain).toLowerCase()] = c.name; });
  const groups = {};
  ADS.forEach(a => {
    const k = compKey(a);
    groups[k] = groups[k] || { key: k, count: 0, names: {} };
    groups[k].count++;
    if (a.advertiser) groups[k].names[a.advertiser] = (groups[k].names[a.advertiser] || 0) + 1;
  });
  return Object.values(groups).map(g => {
    const top = Object.entries(g.names).sort((a, b) => b[1] - a[1])[0];
    return { key: g.key, count: g.count, name: named[g.key] || (top ? top[0] : g.key) };
  }).sort((a, b) => b.count - a.count);
})();
const COMP_NAME = Object.fromEntries(COMPETITORS.map(c => [c.key, c.name]));

function platformOf(ad) {
  const p = String(ad.platform || "").toLowerCase();
  return (p === "facebook" || p === "instagram") ? "meta" : p;
}

/* Carousel order: ads with something to show first, winners first once ranked,
   and on "All" the platforms take turns so a few swipes show every platform. */
function hasContent(a) {
  const m = a.media || {};
  return !!(asList(a.headline).length || a.body || m.image || m.thumbnail || (Array.isArray(a.cards) && a.cards.length));
}
const ORDERED = ADS.map((a, i) => ({ a, i })).sort((x, y) =>
  (hasContent(y.a) - hasContent(x.a)) ||
  ((Number(y.a.score) || -1) - (Number(x.a.score) || -1)) ||
  (x.i - y.i)).map(x => x.a);

function filteredAds() {
  const list = ORDERED.filter(a => inCity(a) && (state.platform === "all" || platformOf(a) === state.platform) && (state.comp === "all" || compKey(a) === state.comp));
  if (state.platform !== "all") return list;
  const groups = PLATFORM_ORDER.map(p => list.filter(a => platformOf(a) === p)).filter(g => g.length);
  const out = [];
  for (let i = 0; out.length < list.length; i++) groups.forEach(g => { if (g[i]) out.push(g[i]); });
  return out;
}

function pageFor(ad) {
  if (!ad) return null;
  const i = ad._page;
  return (typeof i === "number" && PAGES[i]) ? PAGES[i] : null;
}

function renderTop() {
  const tabs = VIEWS.filter(v => v.on());
  const comps = (DATA.competitors && DATA.competitors.length ? DATA.competitors.map(c => c.domain) : COMPETITORS.slice(0, 3).map(c => c.key));
  document.getElementById("top").innerHTML = `
    <div class="brand">
      <div class="mark">${ICON.mark}</div>
      <div><div class="brand-name">Roofing Ads · South Florida</div><div class="brand-sub">${esc(comps.join("  ·  "))}</div></div>
    </div>
    <nav class="tabs">${tabs.map(v => `<button class="tab ${state.view === v.id ? "on" : ""}" data-view="${v.id}"><span class="tab-n">${v.n}</span>${esc(v.label)}</button>`).join("")}</nav>
    ${DATA.mode === "sample" ? `<div class="sample-pill" title="data/ads.json is missing, showing data/sample/">Sample data</div>` : ""}`;
}

function render() {
  CURRENT_FIT = null;
  renderTop();
  const app = document.getElementById("app");
  if (!ADS.length && !DATA.published) {
    app.innerHTML = `<section class="view empty"><h1>No ads yet.</h1></section>`;
    return;
  }
  ({ plumbers: renderPlumbers, ads: renderAdsView, winners: renderWinners, you: renderYou, versus: renderVersus, published: renderPublished }[state.view] || renderAdsView)();
}

function setView(v) {
  const ok = VIEWS.find(x => x.id === v && x.on());
  state.view = ok ? v : defaultView();
  if (location.hash.slice(1) !== state.view) history.replaceState(null, "", "#" + state.view);
  render();
}

function defaultView() {
  const on = VIEWS.filter(v => v.on());
  return on.length ? on[on.length - 1].id : "ads";
}

document.addEventListener("click", e => {
  const more = e.target.closest("[data-more]");
  if (more) { toggleMore(more); return; }
  const t = e.target.closest("[data-view]");
  if (t) { setView(t.dataset.view); return; }
  const open = e.target.closest("[data-open]");
  if (open && !e.target.closest(".stage")) { openPanel(open.dataset.open); return; }
  if (e.target.closest("[data-close]")) closePanel();
});

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape") { closePanel(); return; }
  if (state.view !== "ads" || state.mode !== "carousel" || state.list !== "all") return;
  if (e.key === "ArrowRight") { e.preventDefault(); carGo(state.idx + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); carGo(state.idx - 1); }
  else if (e.key === "Enter") { const ad = filteredAds()[state.idx]; if (ad) openPanel(ad.id); }
});

window.addEventListener("hashchange", () => { closePanel(); setView(location.hash.slice(1)); });

/* Images without a fixed size change an ad's height when they load: refit the current view. */
let CURRENT_FIT = null, fitTimer;
document.getElementById("app").addEventListener("load", e => {
  if (e.target.tagName !== "IMG" || !CURRENT_FIT) return;
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => CURRENT_FIT && CURRENT_FIT(), 200);
}, true);

let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (state.view === "ads") carLayout(false); else render(); }, 120); });

setView(location.hash.slice(1) || defaultView());
Promise.all(["media/bundle0.json", "media/bundle1.json", "media/bundle2.json", "media/bundle3.json"].map(u => fetch(u).then(r => r.ok ? r.json() : {}).catch(() => ({}))))
  .then(list => { list.forEach(b => Object.assign(MEDIA, b)); const id = state.panelId; render(); if (id) openPanel(id, true); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state.view === "ads") carLayout(false); else render(); });

</script>


</body>
